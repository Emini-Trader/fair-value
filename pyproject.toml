[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairvalue"
version = "0.1.0"
description = "S&P 500 (SPX) index vs E-mini (ES) futures fair value calculator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["yfinance>=0.2.0"]

[project.optional-dependencies]
# Live data providers use yfinance for reliable Yahoo data.
# pandas is optional, for analysis only.
analysis = ["pandas>=2.0"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["fairvalue", "fairvalue.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
