name: Update fair value

# Recompute the front fair value for the next session after the US cash close,
# commit the snapshot, and let Vercel redeploy the static page.
# NOTE: scheduled workflows only run on the repository's DEFAULT branch.

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC, Mon-Fri (~after the 16:00 ET close)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: fairvalue-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # always the branch tip, not the trigger SHA
          fetch-depth: 0                 # full history so rebase-on-push works
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build snapshot
        run: python web/build_fairvalue.py
      - name: Commit and push (rebasing onto any concurrent update)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json
          if git diff --cached --quiet; then
            echo "No change to web/data.json."
            exit 0
          fi
          git commit -m "web: update fair value snapshot [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i rejected; retrying after rebase…"
            sleep $((i * 2))
          done
          echo "::error::Failed to push the snapshot after 5 attempts."
          exit 1
