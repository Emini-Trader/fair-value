name: Update fair value

# Recompute the front fair value for the NEXT session in the evening after the
# US close (fair value is an end-of-day figure -- never intraday), commit the
# snapshot, and let Vercel redeploy the static page.
# NOTE: scheduled workflows only run on the repository's DEFAULT branch.

on:
  schedule:
    # Evening, after the 16:00 ET close + settlement, so the day's EOD data is
    # final: price the NEXT session off the close that just settled. GitHub
    # delays scheduled runs by hours, so building in the evening (not after
    # midnight ET) means even a delayed run lands in the early European morning.
    # Two attempts, both still in the New York evening; the build is idempotent
    # (no-op commit if unchanged), so a second one covers a skipped run.
    - cron: "31 22 * * 1-5"   # 22:31 UTC = 18:31 EDT / 17:31 EST (session evening)
    - cron: "31 1 * * 2-6"    # 01:31 UTC = 21:31 EDT / 20:31 EST the same evening
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: fairvalue-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # always the branch tip, not the trigger SHA
          fetch-depth: 0                 # full history so rebase-on-push works
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build snapshot (retry transient feed hiccups, e.g. Yahoo 429)
        run: |
          for i in 1 2 3 4 5; do
            if python web/build_fairvalue.py; then exit 0; fi
            echo "Build attempt $i failed; retrying in $((i * 30))s…"
            sleep $((i * 30))
          done
          echo "::error::snapshot build failed after 5 attempts"
          exit 1
      - name: Commit and push (rebasing onto any concurrent update)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json
          [ -f web/offset_history.jsonl ] && git add web/offset_history.jsonl
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "web: update fair value snapshot [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i rejected; retrying after rebase…"
            sleep $((i * 2))
          done
          echo "::error::Failed to push the snapshot after 5 attempts."
          exit 1
